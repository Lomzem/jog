# Legacy OpenOCD configuration retained for Python parity tests.

if { ![info exists TRANSPORT] } { set TRANSPORT swd }
if { ![info exists SPEED]     } { set SPEED 400 }

adapter driver cmsis-dap
cmsis-dap vid_pid 0x03eb 0x2141
if { [info exists ADAPTER_SERIAL] } { adapter serial $ADAPTER_SERIAL }

transport select $TRANSPORT

set CHIPNAME sam4e
set WORKAREASIZE 0x10000
source [find target/at91sam4XXX.cfg]

set _FLASHNAME $_CHIPNAME.flash
flash bank $_FLASHNAME at91sam4 0x00400000 0 1 1 $_TARGETNAME

# The Atmel-ICE 10-pin header usually has no SRST wired on SAM4E boards, so
# resets go through the Cortex-M SYSRESETREQ path (set by at91sam4XXX.cfg).
reset_config none

# The Atmel-ICE CMSIS-DAP v1.0 firmware corrupts large block transfers above
# ~500 kHz; 400 kHz is the fastest reliably-working speed on this probe.
adapter speed $SPEED
